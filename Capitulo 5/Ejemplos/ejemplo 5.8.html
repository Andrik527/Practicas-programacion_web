<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Reflejo</title>
        <style type = "text/css">
            img { margin-right: 30px;}
            img.below 
            {
                -webkit-box-reflect: below 5px
                -webkit-gradient(
                    linear, left top, left bottom,
                    from(transparent), to(white) );
            }
            img.right 
            {
                -webkit-box-reflect: below 5px
                -webkit-gradient(
                    linear, left top, left bottom,
                    from(transparent), to(white));
            }
        </style>
    </head>
    <body>
        <img class = "below" src = "jhtp.png" width = "138" height="180"
        alt="Portada del librp Java How to Program">
        <img class = "right" src="jhtp.png" width = "138" height="180"
        alt="Portada del libro Java How to Program">

        <p>
            <a href="../../index.html">Inicio</a>
            |
            <a href="ejemplo 5.9.html">Siguiente ➡</a>
        </p>
    </body>
</html>
