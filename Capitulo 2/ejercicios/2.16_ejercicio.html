<!-- Ejercicio 2.16 -->
<!-- Formulario de retroalimentación para futuros estudiantes universitarios. -->

<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Ejercicio 2.16</title>
</head>
<body>
   <h1>Retroalimentaci&oacute;n sobre su visita al campus</h1>

   <form method = "post" action = "http://www.deitel.com">
      <p><label>Nombre:
         <input name = "nombre" type = "text" size = "25">
      </label></p>

      <p><label>Correo electr&oacute;nico:
         <input name = "email" type = "text" size = "25">
      </label></p>

      <p>
         <strong>&iquest;Qu&eacute; fue lo que m&aacute;s le gust&oacute; del campus?</strong><br>
         <label><input name = "gusto" type = "checkbox" value = "campus">Campus</label>
         <label><input name = "gusto" type = "checkbox" value = "estudiantes">Estudiantes</label>
         <label><input name = "gusto" type = "checkbox" value = "ubicacion">Ubicaci&oacute;n</label>
         <label><input name = "gusto" type = "checkbox" value = "ambiente">Ambiente</label>
         <label><input name = "gusto" type = "checkbox" value = "dormitorios">Dormitorios</label>
         <label><input name = "gusto" type = "checkbox" value = "deportes">Deportes</label>
      </p>

      <p>
         <strong>&iquest;C&oacute;mo supo sobre la universidad?</strong><br>
         <label><input name = "comosupo" type = "radio" value = "amigos" checked>Amigos</label>
         <label><input name = "comosupo" type = "radio" value = "television">Televisi&oacute;n</label>
         <label><input name = "comosupo" type = "radio" value = "internet">Internet</label>
         <label><input name = "comosupo" type = "radio" value = "otro">Otro</label>
      </p>

      <p><label>Comentarios adicionales:<br>
         <textarea name = "comentarios" rows = "4" cols = "40"></textarea>
      </label></p>

      <p>
         <input type = "submit" value = "Enviar">
         <input type = "reset" value = "Borrar">
      </p>
   </form>
</body>
</html>
